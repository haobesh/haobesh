name: HAOBESH Android APK

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Get HAOBESH

        uses: actions/checkout@v4

      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 22

      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 21

      - name: Install Capacitor

        run: |

          npm init -y

          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Android App

        run: |

          npx cap init HAOBESH com.haobesh.app --web-dir=.

          npx cap add android

          npx cap sync android

      - name: Build APK

        run: |

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload HAOBESH APK

        uses: actions/upload-artifact@v4

        with:

          name: HAOBESH-APK

          path: android/app/build/outputs/apk/debug/app-debug.apk